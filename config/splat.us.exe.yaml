# splat config — Brave Fencer Musashi main EXE (SLUS-00726, USA)
# Phase 5: rebuild SLUS_007.26 byte-for-byte from disassembly (all-asm skeleton).
#
# Derived from splat 0.41.0's own `python -m splat create_config <PS-X EXE>`
# (splat/scripts/create_config.py::create_psx_config), adapted to this repo's
# paths and the Phase-3 symbol export. PSX-specific values that the generator
# pins (do NOT "tidy" them without evidence): compiler PSYQ, subalign 2,
# section_order rodata/text/data/bss, find_file_boundaries False, gp_value from
# the EXE header's Initial-GP field.
#
# Boundaries (file offsets) come from splat's psxexeinfo estimate:
#   text  @ file 0x800   (vram 0x80010000)
#   data  @ file 0x531DC (vram 0x800629DC)   <- iterate if the link/bytes disagree
#   end   @ file 0x65000 (= 413,696 B)
name: SLUS_007.26
sha1: 143dbb89f34491258bbc27810d0a12ec8b43a8dd
options:
  basename: SLUS_007.26
  target_path: extracted/retail/SLUS_007.26
  elf_path: build/us/SLUS_007.26.elf
  # base_path is resolved relative to THIS yaml's dir (config/), so `..` = repo root
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/us/SLUS_007.26.ld
  ld_dependencies: True

  find_file_boundaries: False
  gp_value: 0x80074750

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Enable if maspsx reorders INCLUDE_ASM output once the code segment is `c`
  # (https://github.com/mkst/maspsx#include_asm-reordering-workaround-hack):
  # include_asm_macro_style: maspsx_hack

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # align 4 (not the code-segment default 16): the text→data boundary at vram
    # 0x800629DC is word-aligned but not 16-aligned, so ALIGN(.,16) would inject
    # 4 padding bytes the original lacks. MIPS is word-aligned, so ALIGN(.,4) is a
    # no-op at every real boundary here.
    align: 4
    subsegments:
      # Per-module optimization mixing (SETUP §5.5): the boot/main/game-mode-dispatch
      # module (vram 0x80010000-0x800123F0) was compiled at -O0; the rest of the text at
      # -O2. Split into two c-subsegments so the Makefile applies per-file flags
      # (build/src/boot.o is overridden to -O0). The split is byte-identical at 100%
      # INCLUDE_ASM (Phase-7 regression gate) — opt level only affects matched C, not stubs.
      # Boundary = func_800123F0 (vram 0x800123F0 -> file vram-0x8000F800 = 0x2BF0).
      - [0x800, c, boot]        # -O0 boot module -> src/boot.c (vram 0x80010000-0x800123F0)
      - [0x2BF0, c, 800]        # -O2 game code   -> src/800.c  (vram 0x800123F0-0x80043088); name "800" kept (legacy) so the matched fns + their asm/nonmatchings/800 paths don't migrate
      # PsyQ libcd region (Phase 7 Task 2'): the real libcd objects are linked here in place of
      # stubs (the .ld swaps build/src/libcd{1,2}.o -> build/psyq/libcd/*.o + NOLOAD data). The
      # 18 objects form two contiguous blocks split by a 76-B non-libcd gap (stays a stub).
      - [0x33888, c, libcd1]    # libcd block 1 -> src/libcd1.c (vram 0x80043088-0x80046980, 11 objs)
      - [0x37180, c, gap]       # non-libcd gap -> src/gap.c    (vram 0x80046980-0x800469CC, stub)
      - [0x371CC, c, libcd2]    # libcd block 2 -> src/libcd2.c (vram 0x800469CC-0x8004787C, 7 objs)
      - [0x3807C, c, 800b]      # -O2 game code -> src/800b.c   (vram 0x8004787C-0x800629DC)
      # Phase 7 (Task 2' / LZSS) — SURGICAL rodata carve for the LZSS switch only.
      # The rodata island (0x80072A38-0x80074750) interleaves game jtbls, game data
      # (loadDestPtrTable @0x80072C70 etc.) and library jtbls (PRESET/OBJT/PRNT @0x800737CC+),
      # so a full-island migration is messy and hits the +24 .align-3 library artifact.
      # But LZSS's jtbl_80072A38 is the FIRST jtbl (right after LzssStateTable/D_80072A34,
      # right before jtbl_80072A4C), so carve ONLY it: a dotted .rodata sibling of the "800"
      # code subseg covering exactly 0x63238-0x6324C migrates jtbl_80072A38 into
      # asm/nonmatchings/800/LzssDecodeSector.s; everything else stays raw in the tail data.
      # tools/ld_interleave.py then places .data(front) -> .rodata(LZSS jtbl) -> .data(tail).
      - [0x531DC, data, 531DC]  # front data (vram 0x800629DC-0x80072A38)
      - [0x63238, .rodata, 800] # LZSS jtbl_80072A38 ONLY (vram 0x80072A38-0x80072A4C) -> migrates into LzssDecodeSector
      - [0x6324C, data, 6324C]  # tail data: rest of island (raw) + globals (vram 0x80072A4C-0x80074800)
  - [0x65000]
