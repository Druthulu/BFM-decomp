# splat config — Brave Fencer Musashi main EXE (SLUS-00726, USA)
# Phase 5: rebuild SLUS_007.26 byte-for-byte from disassembly (all-asm skeleton).
#
# Derived from splat 0.41.0's own `python -m splat create_config <PS-X EXE>`
# (splat/scripts/create_config.py::create_psx_config), adapted to this repo's
# paths and the Phase-3 symbol export. PSX-specific values that the generator
# pins (do NOT "tidy" them without evidence): compiler PSYQ, subalign 2,
# section_order rodata/text/data/bss, find_file_boundaries False, gp_value from
# the EXE header's Initial-GP field.
#
# Boundaries (file offsets) come from splat's psxexeinfo estimate:
#   text  @ file 0x800   (vram 0x80010000)
#   data  @ file 0x531DC (vram 0x800629DC)   <- iterate if the link/bytes disagree
#   end   @ file 0x65000 (= 413,696 B)
name: SLUS_007.26
sha1: 143dbb89f34491258bbc27810d0a12ec8b43a8dd
options:
  basename: SLUS_007.26
  target_path: extracted/retail/SLUS_007.26
  elf_path: build/us/SLUS_007.26.elf
  # base_path is resolved relative to THIS yaml's dir (config/), so `..` = repo root
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/us/SLUS_007.26.ld
  ld_dependencies: True

  find_file_boundaries: False
  gp_value: 0x80074750

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.txt
    # main-scoped symbols OUTSIDE main's image (high RAM the overlays reuse as CODE).
    # NEVER stacked by an overlay/resident — see the header of that file (Phase 26-A).
    - config/symbols.us.ram.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Enable if maspsx reorders INCLUDE_ASM output once the code segment is `c`
  # (https://github.com/mkst/maspsx#include_asm-reordering-workaround-hack):
  # include_asm_macro_style: maspsx_hack

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # align 4 (not the code-segment default 16): the text→data boundary at vram
    # 0x800629DC is word-aligned but not 16-aligned, so ALIGN(.,16) would inject
    # 4 padding bytes the original lacks. MIPS is word-aligned, so ALIGN(.,4) is a
    # no-op at every real boundary here.
    align: 4
    subsegments:
      # Per-module optimization mixing (SETUP §5.5): the boot/main/game-mode-dispatch
      # module (vram 0x80010000-0x800123F0) was compiled at -O0; the rest of the text at
      # -O2. Split into two c-subsegments so the Makefile applies per-file flags
      # (build/src/boot.o is overridden to -O0). The split is byte-identical at 100%
      # INCLUDE_ASM (Phase-7 regression gate) — opt level only affects matched C, not stubs.
      # Boundary = func_800123F0 (vram 0x800123F0 -> file vram-0x8000F800 = 0x2BF0).
      - [0x800, c, boot]        # -O0 boot module -> src/boot.c (vram 0x80010000-0x800123F0)
      # P31 S72 — SPLIT AT THE JTBL-SPAN TU BOUNDARIES. One code object contributes exactly ONE
      # contiguous `.rodata` run, so each jump-table span needs its own object. The span owners'
      # address ranges are DISJOINT AND ORDERED, which is the evidence that these are (at least
      # some of) the original translation-unit boundaries — tables pack tight WITHIN a TU and are
      # separated by other data ACROSS TUs (§8e/§426). Splitting here is therefore both the fix
      # and the minimum: any extra split would be speculation. `800` keeps its legacy name so the
      # matched fns + their asm/nonmatchings/800 paths don't migrate.
      - [0x2BF0, c, 800]        # -O2 game code -> src/800.c    (vram 0x800123F0-0x8002B0B4); owns .rodata span A
      # P31 S77 — 3-way cut for the -O0 island func_8002C410 (0x8002C410-0x8002C8BC). gcc-2.7.2
      # has no per-function optimize pragma, so the opt level is per FILE (§116): the island needs
      # its own object for the Makefile -O0 glob. The outer pieces stay -O2.
      - [0x1B8B4, c, 800_b]     # -O2 -> src/800_b.c     (vram 0x8002B0B4-0x8002C410); owns .rodata span B (front)
      - [0x1CC10, c, 800_b_o0a] # -O0 ISLAND -> src/800_b_o0a.c (vram 0x8002C410-0x8002C8BC)
      - [0x1D0BC, c, 800_b_2]   # -O2 -> src/800_b_2.c   (vram 0x8002C8BC-0x80035270); owns .rodata span B (tail)
      - [0x25A70, c, 800_c]     # -O2 game code -> src/800_c.c  (vram 0x80035270-0x8003A444); owns .rodata span C
      # PsyQ libspu+libsnd COMBINED sound region (Phase 8): the two SDK sound libs are interleaved here,
      # so they link as one 63-object region (curated by tools/make_snd_used.py; 3 addresses excluded as
      # cross-object-common/false-positive stubs: S_R/S_W 0x3C438, S_GRMDT* 0x3D424, S_IH/UT_RON 0x3D94C).
      # VM_F 0x3FA64 was the 4th exclusion (scattered-.bss) until P31 S78 #4: psyq_integrate now splits
      # such a .bss into per-base NOLOAD pieces at link-prepare (psyq_bss_split, cookbook §489) and it
      # links as snd12. Subsegs via gen_lib_subsegs.py; integrate window 0x3A444..0x4239C. snd1..snd12
      # link; sgap* = game code + the 3 excluded stubs. (libsnd SSGM.o @0x1BD80 stays a stub in 800.)
      - [0x2AC44, c, snd1]  # snd block 1: 15 obj (S_INI.o..S_SK.o) vram 0x8003A444-0x8003C438
      - [0x2CC38, c, sgap]  # game code (vram 0x8003C438-0x8003C498)
      - [0x2CC98, c, snd2]  # snd block 2: 8 obj (S_STSA.o..S_SRMD.o) vram 0x8003C498-0x8003D424
      - [0x2DC24, c, sgap_2]  # game code + excluded S_GRMDT stub (vram 0x8003D424-0x8003D434)
      - [0x2DC34, c, snd3]  # snd block 3: 4 obj (S_GRMD.o..SSINIT.o) vram 0x8003D434-0x8003D630
      - [0x2DE30, c, sgap_3]  # game code (vram 0x8003D630-0x8003D650)
      - [0x2DE50, c, snd4]  # snd block 4: 3 obj (SSSATTR.o..SSCALL.o) vram 0x8003D650-0x8003DC90
      - [0x2E490, c, sgap_4]  # game code (vram 0x8003DC90-0x8003E248)
      - [0x2EA48, c, snd5]  # snd block 5: 1 obj (PAUSE.o) vram 0x8003E248-0x8003E2E4
      - [0x2EAE4, c, sgap_5]  # game code (vram 0x8003E2E4-0x8003E310)
      - [0x2EB10, c, snd6]  # snd block 6: 12 obj (MIDIREAD.o..VM_ALOC2.o) vram 0x8003E310-0x8003FA54
      - [0x30254, c, sgap_6]  # game code: func_8003FA54, 4 ins (vram 0x8003FA54-0x8003FA64)
      - [0x30264, c, snd12]  # snd block 12 (S78 #4): VM_F.o (237 ins, exact tile; .bss split ×2 at link-prepare, §489) vram 0x8003FA64-0x8003FE18 — carved off sgap_6
      - [0x30618, c, snd7]  # snd block 7: 5 obj (S_SNV.o..VM_N2P.o) vram 0x8003FE18-0x800403A4
      - [0x30BA4, c, snd10]  # snd block 10 (S78): VM_NO1.o (305 ins, exact tile) vram 0x800403A4-0x80040868 — was 'sgap_7' game code (§485)
      - [0x31068, c, snd8]  # snd block 8: 1 obj (VM_NOWOF.o) vram 0x80040868-0x80040938
      - [0x31138, c, snd11]  # snd block 11 (S78): VM_NOWON.o (300 ins, exact tile) vram 0x80040938-0x80040DE8 — carved off the old sgap_8
      - [0x315E8, c, sgap_8]  # game code (vram 0x80040DE8-0x800414E4)
      - [0x31CE4, c, snd9]  # snd block 9: 11 obj (VM_VSU.o..VS_VTC.o) vram 0x800414E4-0x8004239C
      # PsyQ libetc region (Phase 8): 5 objects (VSYNC/INTR/INTR_VB/INTR_DMA/VMODE) form ONE
