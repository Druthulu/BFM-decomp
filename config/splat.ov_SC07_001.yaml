      - [0x184b0, c, ov_SC07_001_jr_80140608]
      - [0x1CA44, c, ov_SC07_001_o0b]  # -O0 whale func_80144B9C (0x1CA44..0x1D64C)
      - [0x1d64c, c, ov_SC07_001_after]
      - [0x2c2f4, c, ov_SC07_001_jr_8015444C]
      - [0x2cacc, c, ov_SC07_001_jr_80154C24]
      - [0x30774, c, ov_SC07_001_jr_801588CC]
      - [0x31b2c, c, ov_SC07_001_jr_80159C84]
      - [0x32270, c, ov_SC07_001_jr_8015A3C8]
      - [0x32cd4, c, ov_SC07_001_jr_8015AE2C]
      - [0x341d4, c, ov_SC07_001_jr_8015C32C]
      - [0x42a14, c, ov_SC07_001_jr_8016AB6C]
      - [0x4b364, c, ov_SC07_001_jr_801734BC]
      - [0x50be8, c, ov_SC07_001_jr_80178D40]
      - [0x52354, c, ov_SC07_001_jr_8017A4AC]
      - [0x52cd4, c, ov_SC07_001_jr_8017AE2C]
      - [0x53d64, c, ov_SC07_001_jr_8017BEBC]
      - [0x59388, data, tail]
      - [0x80690, .rodata, ov_SC07_001_jr_8012ACE0]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x80770, data, tail2]
      - [0x80788, .rodata, ov_SC07_001_jr_80135888]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x8079c, data, tail3]
      - [0x807a0, .rodata, ov_SC07_001_jr_80135A4C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x807b4, data, tail4]
      - [0x807b8, .rodata, ov_SC07_001_jr_80135D20]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x807cc, data, tail5]
