# splat config TEMPLATE — Brave Fencer Musashi location overlays (SCxx.CD/FILE_nnn/0.4.dec)
# =============================================================================
# Phase 13: the reusable flat-blob splat config for a LOCATION OVERLAY. ~134 overlays
# all stream into the SAME RAM slot (vram 0x80128158) and chain into the resident engine
# (0x800CEDF8) + the EXE. This is a TEMPLATE: the @TOKEN@ placeholders are substituted to
# produce config/splat.<alias>.yaml — by tools/new_overlay.sh (Phase 13 T4), or by hand
# (Phase 13 T1a for the first overlay). It is NOT a valid splat config until instantiated.
#
# Placeholders:
#   ov_SC03_001    binary alias, ov_<SCxx>_<nnn>      e.g. ov_SC01_077
#   extracted/retail/SC03.CD.dir/FILE_001.dir/0.4.dec extracted 0.4.dec payload path     e.g. extracted/retail/SC01.CD.dir/FILE_077.dir/0.4.dec
#   f8fd92f59c6871577c61cb626cb9ddb0db5ba884     sha1 of the 0.4.dec (the build-identity target; also -> config/check.<alias>.sha)
#   0x80128158     load vram (the shared overlay slot) e.g. 0x80128158  (constant across overlays today;
#              parameterized so a future non-0x80128158 overlay needs no template edit)
#   0x650C8 file offset where code ends -> data tail begins (iterated vs the byte check, T1b)
#   0xC730F      file size in bytes (the EOF marker; = the 0.4.dec length)
#
# Modeled on config/splat.resident.yaml (the Phase-10 flat-blob recipe), with overlays'
# differences: (1) code at file offset 0x0 (overlays open with a function prologue, NOT a
# leading data word like the resident — so NO leading-rodata trick by default; see the
# commented `head` slot for the rare pre-code-data overlay); (2) symbol_addrs_path ALSO
# stacks config/symbols.resident.txt because overlays reference resident engine globals;
# (3) vram is the overlay slot. Everything else matches the resident options verbatim.
#
# Byte-match is robust to the exact text/data split (splat round-trips the bytes — the
# resident precedent); iterate 0x650C8 against `make check BINARY=ov_SC03_001` (Phase-5/10
# precedent). LZSS is NOT in the verify path — we match the DECOMPRESSED 0.4.dec (repack is Gen3).
name: ov_SC03_001
sha1: f8fd92f59c6871577c61cb626cb9ddb0db5ba884
options:
  basename: ov_SC03_001
  target_path: extracted/retail/SC03.CD.dir/FILE_001.dir/0.4.dec
  elf_path: build/ov_SC03_001/ov_SC03_001.elf
  # base_path is resolved relative to THIS yaml's dir (config/), so `..` = repo root
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_SC03_001
  src_path: src/ov_SC03_001
  # asset_path scoped per-alias so a `bin` subseg (the trailing-partial-word carve, below) lands at
  # assets/ov_SC03_001/*.bin and never collides with another overlay's same-named asset. The Makefile's
  # build/assets/%.o rule incbin's it into a linkable object.
  asset_path: assets/ov_SC03_001
  # build_path = build (NOT build/<alias>): splat writes the .ld's object paths under
  # $(build_path), and the Makefile's pattern rules build them at build/asm/** + build/src/**.
  # Only the elf/ld/output live in build/<alias>/.
  build_path: build
  ld_script_path: build/ov_SC03_001/ov_SC03_001.ld
  ld_dependencies: True

  # Per-binary undefined-symbol outputs (under build/<alias>/), so `make clean`'s `rm -rf build`
  # covers them and binaries never share a stale file.
  undefined_syms_auto_path: build/ov_SC03_001/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/ov_SC03_001/undefined_funcs_auto.txt

  find_file_boundaries: False
  # NO gp_value: overlays are -G0 (verify zero ($gp)/%gp_rel in the disasm). Omitting it -> no _gp.

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Stacked symbols: shared engine globals (symbols.us.txt) + resident engine globals the overlay
  # calls (symbols.resident.txt) + the overlay-local names/boundaries (symbols.<alias>.txt, seeded
  # T1c from sig_image + duplicates.cross.md; R13/R15-tagged, overlay-region only).
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.resident.txt
    - config/symbols.ov_SC03_001.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Enable if maspsx reorders INCLUDE_ASM output in c-mode (unused for the EXE/resident):
  # include_asm_macro_style: maspsx_hack

segments:
  - name: ov_SC03_001
    type: code
    start: 0x0
    vram: 0x80128158
    # align 4 (not the code default 16): MIPS is word-aligned; mirrors the EXE/resident choice.
    align: 4
    subsegments:
      # OPTIONAL leading pre-code data/rodata island (rare): if an overlay begins with a data
      # word BEFORE its first function (the resident's case), uncomment a `head` subseg here and
      # shift the code start. Mark it `rodata` (section_order places .rodata first) so it lands at
      # 0x80128158 ahead of the code, a 1-word analogue of main's rodata-island (no ld_interleave).
      # - [0x0, rodata, head]
      - [0x0, c, ov_SC03_001]
      - [0x2b88, c, ov_SC03_001_jr_8012ACE0]
      - [0xff88, c, ov_SC03_001_jr_801380E0]
      - [0x171f8, c, ov_SC03_001_jr_8013F350]
      - [0x17e80, c, ov_SC03_001_jr_8013FFD8]
      - [0x1CA44, c, ov_SC03_001_o0b]  # -O0 whale func_80144B9C (0x1CA44..0x1D64C)
      - [0x1d64c, c, ov_SC03_001_after]
      - [0x2c2f4, c, ov_SC03_001_jr_8015444C]
      - [0x2cacc, c, ov_SC03_001_jr_80154C24]
      - [0x30774, c, ov_SC03_001_jr_801588CC]
      - [0x31b2c, c, ov_SC03_001_jr_80159C84]
      - [0x32270, c, ov_SC03_001_jr_8015A3C8]
      - [0x32cd4, c, ov_SC03_001_jr_8015AE2C]
      - [0x341d4, c, ov_SC03_001_jr_8015C32C]
      - [0x42a14, c, ov_SC03_001_jr_8016AB6C]
      - [0x4b364, c, ov_SC03_001_jr_801734BC]
      - [0x50be8, c, ov_SC03_001_jr_80178D40]
      - [0x52354, c, ov_SC03_001_jr_8017A4AC]
      - [0x650c8, data, tail]
      - [0xc3bf8, .rodata, ov_SC03_001_jr_8012ACE0]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc3cd8, data, tail2]
      - [0xc3d70, .rodata, ov_SC03_001_jr_801380E0]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc3dd4, data, tail3]
      - [0xc43e0, .rodata, ov_SC03_001_jr_8013F350]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4414, data, tail4]
      - [0xc4418, .rodata, ov_SC03_001_jr_8013FFD8]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc444c, data, tail5]
      - [0xc44b4, .rodata, ov_SC03_001_jr_8015444C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4520, data, tail6]
      - [0xc4590, .rodata, ov_SC03_001_jr_80154C24]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc45b4, data, tail7]
      - [0xc45d4, .rodata, ov_SC03_001_jr_801588CC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc45f8, data, tail8]
      - [0xc467c, .rodata, ov_SC03_001_jr_80159C84]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc46b0, data, tail9]
      - [0xc46b4, .rodata, ov_SC03_001_jr_8015A3C8]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc46d0, data, tail10]
      - [0xc46d4, .rodata, ov_SC03_001_jr_8015AE2C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc46f0, data, tail11]
      - [0xc4714, .rodata, ov_SC03_001_jr_8015C32C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4730, data, tail12]
      - [0xc4748, .rodata, ov_SC03_001_jr_8016AB6C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4768, data, tail13]
      - [0xc47e8, .rodata, ov_SC03_001_jr_801734BC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc47fc, data, tail14]
      - [0xc49a4, .rodata, ov_SC03_001_jr_80178D40]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4b1c, data, tail15]
      - [0xc4bac, .rodata, ov_SC03_001_jr_8017A4AC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0xc4c38, data, tail16]
      - [0xC730C, bin, trailing]    # final 3 bytes (EOF not 4-aligned; spimdisasm drops a partial word)
  - [0xC730F]   # EOF marker = the 0.4.dec byte length
# @TRAILING@ (above) is replaced by tools/new_overlay.sh: for a non-4-aligned overlay it becomes
#   `      - [0x<word_floor>, bin, trailing]`  (the final 1-3 bytes spimdisasm's data path drops);
# for a 4-aligned overlay the marker line is removed. The Makefile build/assets/%.o rule + the
# objcopy end-align TRIM finish the job. Hand-instantiated configs (ov_SC01_077) inline the carve.
