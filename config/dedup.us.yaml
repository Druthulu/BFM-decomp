# config/dedup.us.yaml — cross-binary code-share registry (Phase 11, G7 "match once, share").
# =============================================================================
# Each group binds ONE shared C body to >=2 duplicate function instances that compile
# byte-identically across binaries. The share is SOURCE-LEVEL (not an object swap): the
# body lives once in `source` (a macro in src/shared/<fn>.h) and is instantiated at each
# member's site in that binary's game-code .c, so the same bytes land at each member vram.
#
# Why source-level (the byte-reality, Phase 11): game-code functions are INTERIOR to one
# compiled object per binary (build/src/800.o, build/resident/resident.o). The linker can't
# excise interior bytes, so the psyq_integrate object-swap (which works only for separate
# library SUBSEGMENT stubs) does not apply. The .ld interpose stays the LIBRARY mechanism.
#
# The byte-gate is the existing per-binary `make check BINARY=<bin>` (the image is identical
# or it is not). tools/dedup_integrate.py is the BYTE-HONESTY VALIDATOR: it fail-closes if a
# member's current signature hash no longer equals the recorded `hash` (a drifted share), so a
# wrong/stale collapse is caught before it can mislead. h_exact = guaranteed byte-match;
# h_norm = candidate, accepted only if every claiming binary still builds byte-identical.
#
# Schema (per group):
#   id      stable handle (mirrors a docs/duplicates.cross.md gid + a descriptive suffix)
#   tier    h_exact | h_norm   (validation column + risk class)
#   hash    the tier hash ALL members must share in .run/sig.<binary>.jsonl (fail-closed key)
#   source  the shared C body (a macro header), #included + instantiated at each member site
#   func    the C macro/symbol the shared source defines
#   members list of { binary, vram, name } — one per duplicate instance (>=2), across binaries
#
# Example (the Phase-11 intra-binary proof group; T3 fills it in for real):
#   - id: I0_func_80037004
#     tier: h_exact
#     hash: <h_exact from .run/sig.SLUS_007.26.jsonl>
#     source: src/shared/clearTbl40.h
#     func: ClearTbl40
#     members:
#       - { binary: main, vram: 0x80037004, name: func_80037004 }
#       - { binary: main, vram: 0x80037334, name: func_80037334 }
#
# Forward-compatible: a cross-binary group just lists members in >1 binary, e.g. a future
# resident<->overlay engine helper:
#   - id: X0_engineHelper
#     tier: h_exact
#     hash: <shared h_exact>
#     source: src/shared/engineHelper.h
#     func: EngineHelper
#     members:
#       - { binary: resident,   vram: 0x800dXXXX, name: FUN_800dXXXX }
#       - { binary: ovSC01_077, vram: 0x8012XXXX, name: FUN_8012XXXX }
# =============================================================================
version: 1
groups:
  # I0 — Phase-11 intra-binary proof: the byte-identical pair func_80037004 / func_80037334
  # (9-ins byte-clear loop) matched ONCE in src/shared/clearTbl40.h, instantiated at both sites
  # in src/800.c. Clean rebuild of `main` stays 143dbb89 with the shared C and with INCLUDE_ASM
  # stubs (both byte-identical). Proves the source-level share machinery + the byte-honesty gate.
  - id: I0_clearTbl40
    tier: h_exact
    hash: a0744d60bfa18d153690d4932282d5e9c703ccdd
    source: src/shared/clearTbl40.h
    func: CLEAR_TBL40
    members:
      - { binary: main, vram: 0x80037004, name: func_80037004 }
      - { binary: main, vram: 0x80037334, name: func_80037334 }

  # D1/D2/D3 — Phase-13 CROSS-OVERLAY proof: the byte-identical duplicate pair SC01/005 ≡ SC01/006
  # (one 0.4.dec, sha1 56760dbe) shares three trivial accessors from ONE source (src/shared/ov_setters.h),
  # instantiated in place in both overlays' .c. Both `make check BINARY=ov_SC01_005` and `=ov_SC01_006`
  # stay 56760dbe with the shared C (and with the INCLUDE_ASM stubs) — one match, two binaries. The
  # generic SETTER/RETCONST macros are reusable fleet-wide (Phase 15 appends members as overlays onboard).
  - id: D1_ov_dup_8012AD64
    tier: h_exact
    hash: 89004be30998a495e3d94dbec7513e3d37f47d8d
    source: src/shared/ov_setters.h
    func: SETTER
    members:
      - { binary: ov_SC01_005, vram: 0x8012AD64, name: func_8012AD64 }
      - { binary: ov_SC01_006, vram: 0x8012AD64, name: func_8012AD64 }
  - id: D2_ov_dup_8012BF4C
    tier: h_exact
    hash: b039ed440779107270b60a3b2ca44b3b097b9c87
    source: src/shared/ov_setters.h
    func: SETTER
    members:
      - { binary: ov_SC01_005, vram: 0x8012BF4C, name: func_8012BF4C }
      - { binary: ov_SC01_006, vram: 0x8012BF4C, name: func_8012BF4C }
  - id: D3_ov_dup_8012E27C
    tier: h_exact
