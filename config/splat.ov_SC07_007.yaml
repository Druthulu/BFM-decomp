# splat config TEMPLATE — Brave Fencer Musashi location overlays (SCxx.CD/FILE_nnn/0.4.dec)
# =============================================================================
# Phase 13: the reusable flat-blob splat config for a LOCATION OVERLAY. ~134 overlays
# all stream into the SAME RAM slot (vram 0x80128158) and chain into the resident engine
# (0x800CEDF8) + the EXE. This is a TEMPLATE: the @TOKEN@ placeholders are substituted to
# produce config/splat.<alias>.yaml — by tools/new_overlay.sh (Phase 13 T4), or by hand
# (Phase 13 T1a for the first overlay). It is NOT a valid splat config until instantiated.
#
# Placeholders:
#   ov_SC07_007    binary alias, ov_<SCxx>_<nnn>      e.g. ov_SC01_077
#   extracted/retail/SC07.CD.dir/FILE_007.dir/1.4.dec extracted 0.4.dec payload path     e.g. extracted/retail/SC01.CD.dir/FILE_077.dir/0.4.dec
#   b3b95547ed6830302ae27375b463947b4999dc5e     sha1 of the 0.4.dec (the build-identity target; also -> config/check.<alias>.sha)
#   0x80128158     load vram (the shared overlay slot) e.g. 0x80128158  (constant across overlays today;
#              parameterized so a future non-0x80128158 overlay needs no template edit)
#   0x5AD8C file offset where code ends -> data tail begins (iterated vs the byte check, T1b)
#   0x9F9DF      file size in bytes (the EOF marker; = the 0.4.dec length)
#
# Modeled on config/splat.resident.yaml (the Phase-10 flat-blob recipe), with overlays'
# differences: (1) code at file offset 0x0 (overlays open with a function prologue, NOT a
# leading data word like the resident — so NO leading-rodata trick by default; see the
# commented `head` slot for the rare pre-code-data overlay); (2) symbol_addrs_path ALSO
# stacks config/symbols.resident.txt because overlays reference resident engine globals;
# (3) vram is the overlay slot. Everything else matches the resident options verbatim.
#
# Byte-match is robust to the exact text/data split (splat round-trips the bytes — the
# resident precedent); iterate 0x5AD8C against `make check BINARY=ov_SC07_007` (Phase-5/10
# precedent). LZSS is NOT in the verify path — we match the DECOMPRESSED 0.4.dec (repack is Gen3).
name: ov_SC07_007
sha1: b3b95547ed6830302ae27375b463947b4999dc5e
options:
  basename: ov_SC07_007
  target_path: extracted/retail/SC07.CD.dir/FILE_007.dir/1.4.dec
  elf_path: build/ov_SC07_007/ov_SC07_007.elf
  # base_path is resolved relative to THIS yaml's dir (config/), so `..` = repo root
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_SC07_007
  src_path: src/ov_SC07_007
  # asset_path scoped per-alias so a `bin` subseg (the trailing-partial-word carve, below) lands at
  # assets/ov_SC07_007/*.bin and never collides with another overlay's same-named asset. The Makefile's
  # build/assets/%.o rule incbin's it into a linkable object.
  asset_path: assets/ov_SC07_007
  # build_path = build (NOT build/<alias>): splat writes the .ld's object paths under
  # $(build_path), and the Makefile's pattern rules build them at build/asm/** + build/src/**.
  # Only the elf/ld/output live in build/<alias>/.
  build_path: build
  ld_script_path: build/ov_SC07_007/ov_SC07_007.ld
  ld_dependencies: True

  # Per-binary undefined-symbol outputs (under build/<alias>/), so `make clean`'s `rm -rf build`
  # covers them and binaries never share a stale file.
  undefined_syms_auto_path: build/ov_SC07_007/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/ov_SC07_007/undefined_funcs_auto.txt

  find_file_boundaries: False
  # NO gp_value: overlays are -G0 (verify zero ($gp)/%gp_rel in the disasm). Omitting it -> no _gp.

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Stacked symbols: shared engine globals (symbols.us.txt) + resident engine globals the overlay
  # calls (symbols.resident.txt) + the overlay-local names/boundaries (symbols.<alias>.txt, seeded
  # T1c from sig_image + duplicates.cross.md; R13/R15-tagged, overlay-region only).
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.resident.txt
    - config/symbols.ov_SC07_007.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Enable if maspsx reorders INCLUDE_ASM output in c-mode (unused for the EXE/resident):
  # include_asm_macro_style: maspsx_hack

segments:
  - name: ov_SC07_007
    type: code
    start: 0x0
    vram: 0x80128158
    # align 4 (not the code default 16): MIPS is word-aligned; mirrors the EXE/resident choice.
    align: 4
    subsegments:
      # OPTIONAL leading pre-code data/rodata island (rare): if an overlay begins with a data
      # word BEFORE its first function (the resident's case), uncomment a `head` subseg here and
      # shift the code start. Mark it `rodata` (section_order places .rodata first) so it lands at
      # 0x80128158 ahead of the code, a 1-word analogue of main's rodata-island (no ld_interleave).
      # - [0x0, rodata, head]
      - [0x0, c, ov_SC07_007]
      - [0x91e8, c, ov_SC07_007_jr_80131340]
      - [0xd730, c, ov_SC07_007_jr_80135888]
      - [0xd8f4, c, ov_SC07_007_jr_80135A4C]
      - [0xdbc8, c, ov_SC07_007_jr_80135D20]
      - [0x171f8, c, ov_SC07_007_jr_8013F350]
      - [0x184b0, c, ov_SC07_007_jr_80140608]
      - [0x2cacc, c, ov_SC07_007_jr_80154C24]
      - [0x30774, c, ov_SC07_007_jr_801588CC]
      - [0x337f8, c, ov_SC07_007_jr_8015B950]
      - [0x341d4, c, ov_SC07_007_jr_8015C32C]
      - [0x42d04, c, ov_SC07_007_jr_8016AE5C]
      - [0x52cd4, c, ov_SC07_007_jr_8017AE2C]
      - [0x53d64, c, ov_SC07_007_jr_8017BEBC]
      - [0x5ad8c, data, tail]
      - [0x9d1fc, .rodata, ov_SC07_007]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9d2d8, data, tail2]
      - [0x9d3a4, .rodata, ov_SC07_007_jr_80131340]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9d3b8, data, tail3]
      - [0x9d3d0, .rodata, ov_SC07_007_jr_80135888]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9d3e4, data, tail4]
      - [0x9d3e8, .rodata, ov_SC07_007_jr_80135A4C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9d3fc, data, tail5]
      - [0x9d400, .rodata, ov_SC07_007_jr_80135D20]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9d414, data, tail6]
      - [0x9dac0, .rodata, ov_SC07_007_jr_8013F350]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9daf4, data, tail7]
      - [0x9db68, .rodata, ov_SC07_007_jr_80140608]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9db7c, data, tail8]
      - [0x9dc70, .rodata, ov_SC07_007_jr_80154C24]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9dcb4, .rodata, ov_SC07_007_jr_801588CC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9dcfc, data, tail9]
      - [0x9ddd4, .rodata, ov_SC07_007_jr_8015B950]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9ddf0, data, tail10]
      - [0x9ddf4, .rodata, ov_SC07_007_jr_8015C32C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9de10, data, tail11]
      - [0x9de48, .rodata, ov_SC07_007_jr_8016AE5C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9de68, data, tail12]
      - [0x9e31c, .rodata, ov_SC07_007_jr_8017AE2C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9e330, .rodata, ov_SC07_007_jr_8017BEBC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x9e350, data, tail13]
      - [0x9F9DC, bin, trailing]    # final 3 bytes (EOF not 4-aligned; spimdisasm drops a partial word)
  - [0x9F9DF]   # EOF marker = the 0.4.dec byte length
# @TRAILING@ (above) is replaced by tools/new_overlay.sh: for a non-4-aligned overlay it becomes
#   `      - [0x<word_floor>, bin, trailing]`  (the final 1-3 bytes spimdisasm's data path drops);
# for a 4-aligned overlay the marker line is removed. The Makefile build/assets/%.o rule + the
# objcopy end-align TRIM finish the job. Hand-instantiated configs (ov_SC01_077) inline the carve.
