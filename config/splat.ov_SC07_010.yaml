# splat config TEMPLATE — Brave Fencer Musashi location overlays (SCxx.CD/FILE_nnn/0.4.dec)
# =============================================================================
# Phase 13: the reusable flat-blob splat config for a LOCATION OVERLAY. ~134 overlays
# all stream into the SAME RAM slot (vram 0x80128158) and chain into the resident engine
# (0x800CEDF8) + the EXE. This is a TEMPLATE: the @TOKEN@ placeholders are substituted to
# produce config/splat.<alias>.yaml — by tools/new_overlay.sh (Phase 13 T4), or by hand
# (Phase 13 T1a for the first overlay). It is NOT a valid splat config until instantiated.
#
# Placeholders:
#   ov_SC07_010    binary alias, ov_<SCxx>_<nnn>      e.g. ov_SC01_077
#   extracted/retail/SC07.CD.dir/FILE_010.dir/1.4.dec extracted 0.4.dec payload path     e.g. extracted/retail/SC01.CD.dir/FILE_077.dir/0.4.dec
#   d7b5875d60ea6224d204ca5c4a53c561fdab8200     sha1 of the 0.4.dec (the build-identity target; also -> config/check.<alias>.sha)
#   0x80128158     load vram (the shared overlay slot) e.g. 0x80128158  (constant across overlays today;
#              parameterized so a future non-0x80128158 overlay needs no template edit)
#   0x59E1C file offset where code ends -> data tail begins (iterated vs the byte check, T1b)
#   0x813EF      file size in bytes (the EOF marker; = the 0.4.dec length)
#
# Modeled on config/splat.resident.yaml (the Phase-10 flat-blob recipe), with overlays'
# differences: (1) code at file offset 0x0 (overlays open with a function prologue, NOT a
# leading data word like the resident — so NO leading-rodata trick by default; see the
# commented `head` slot for the rare pre-code-data overlay); (2) symbol_addrs_path ALSO
# stacks config/symbols.resident.txt because overlays reference resident engine globals;
# (3) vram is the overlay slot. Everything else matches the resident options verbatim.
#
# Byte-match is robust to the exact text/data split (splat round-trips the bytes — the
# resident precedent); iterate 0x59E1C against `make check BINARY=ov_SC07_010` (Phase-5/10
# precedent). LZSS is NOT in the verify path — we match the DECOMPRESSED 0.4.dec (repack is Gen3).
name: ov_SC07_010
sha1: d7b5875d60ea6224d204ca5c4a53c561fdab8200
options:
  basename: ov_SC07_010
  target_path: extracted/retail/SC07.CD.dir/FILE_010.dir/1.4.dec
  elf_path: build/ov_SC07_010/ov_SC07_010.elf
  # base_path is resolved relative to THIS yaml's dir (config/), so `..` = repo root
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/ov_SC07_010
  src_path: src/ov_SC07_010
  # asset_path scoped per-alias so a `bin` subseg (the trailing-partial-word carve, below) lands at
  # assets/ov_SC07_010/*.bin and never collides with another overlay's same-named asset. The Makefile's
  # build/assets/%.o rule incbin's it into a linkable object.
  asset_path: assets/ov_SC07_010
  # build_path = build (NOT build/<alias>): splat writes the .ld's object paths under
  # $(build_path), and the Makefile's pattern rules build them at build/asm/** + build/src/**.
  # Only the elf/ld/output live in build/<alias>/.
  build_path: build
  ld_script_path: build/ov_SC07_010/ov_SC07_010.ld
  ld_dependencies: True

  # Per-binary undefined-symbol outputs (under build/<alias>/), so `make clean`'s `rm -rf build`
  # covers them and binaries never share a stale file.
  undefined_syms_auto_path: build/ov_SC07_010/undefined_syms_auto.txt
  undefined_funcs_auto_path: build/ov_SC07_010/undefined_funcs_auto.txt

  find_file_boundaries: False
  # NO gp_value: overlays are -G0 (verify zero ($gp)/%gp_rel in the disasm). Omitting it -> no _gp.

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # Stacked symbols: shared engine globals (symbols.us.txt) + resident engine globals the overlay
  # calls (symbols.resident.txt) + the overlay-local names/boundaries (symbols.<alias>.txt, seeded
  # T1c from sig_image + duplicates.cross.md; R13/R15-tagged, overlay-region only).
  symbol_addrs_path:
    - config/symbols.us.txt
    - config/symbols.resident.txt
    - config/symbols.ov_SC07_010.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # Enable if maspsx reorders INCLUDE_ASM output in c-mode (unused for the EXE/resident):
  # include_asm_macro_style: maspsx_hack

segments:
  - name: ov_SC07_010
    type: code
    start: 0x0
    vram: 0x80128158
    # align 4 (not the code default 16): MIPS is word-aligned; mirrors the EXE/resident choice.
    align: 4
    subsegments:
      # OPTIONAL leading pre-code data/rodata island (rare): if an overlay begins with a data
      # word BEFORE its first function (the resident's case), uncomment a `head` subseg here and
      # shift the code start. Mark it `rodata` (section_order places .rodata first) so it lands at
      # 0x80128158 ahead of the code, a 1-word analogue of main's rodata-island (no ld_interleave).
      # - [0x0, rodata, head]
      - [0x0, c, ov_SC07_010]
      - [0x91e8, c, ov_SC07_010_jr_80131340]
      - [0xd730, c, ov_SC07_010_jr_80135888]
      - [0xd8f4, c, ov_SC07_010_jr_80135A4C]
      - [0xdbc8, c, ov_SC07_010_jr_80135D20]
      - [0x13410, c, ov_SC07_010_o0]  # -O0 cluster 0x8013B568..0x8013C98C (0x13410..0x14834)
      - [0x14834, c, ov_SC07_010_o2b]
      - [0x171f8, c, ov_SC07_010_jr_8013F350]
      - [0x181d4, c, ov_SC07_010_jr_8014032C]
      - [0x184b0, c, ov_SC07_010_jr_80140608]
      - [0x2cacc, c, ov_SC07_010_jr_80154C24]
      - [0x30774, c, ov_SC07_010_jr_801588CC]
      - [0x32270, c, ov_SC07_010_jr_8015A3C8]
      - [0x337f8, c, ov_SC07_010_jr_8015B950]
      - [0x341d4, c, ov_SC07_010_jr_8015C32C]
      - [0x42d04, c, ov_SC07_010_jr_8016AE5C]
      - [0x499f4, c, ov_SC07_010_jr_80171B4C]
      - [0x50854, c, ov_SC07_010_jr_801789AC]
      - [0x51a1c, c, ov_SC07_010_jr_80179B74]
      - [0x52cd4, c, ov_SC07_010_jr_8017AE2C]
      - [0x59e1c, data, tail]
      - [0x7d6dc, .rodata, ov_SC07_010]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7d7b8, data, tail2]
      - [0x7d884, .rodata, ov_SC07_010_jr_80131340]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7d8ac, data, tail3]
      - [0x7d8b0, .rodata, ov_SC07_010_jr_80135888]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7d8c4, data, tail4]
      - [0x7d8c8, .rodata, ov_SC07_010_jr_80135A4C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7d8dc, data, tail5]
      - [0x7d8e0, .rodata, ov_SC07_010_jr_80135D20]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7d924, data, tail6]
      - [0x7d994, .rodata, ov_SC07_010_o0]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7db18, data, tail7]
      - [0x7dfa0, .rodata, ov_SC07_010_jr_8013F350]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7dfd4, data, tail8]
      - [0x7e010, .rodata, ov_SC07_010_jr_8014032C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e044, data, tail9]
      - [0x7e048, .rodata, ov_SC07_010_jr_80140608]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e05c, data, tail10]
      - [0x7e150, .rodata, ov_SC07_010_jr_80154C24]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e194, .rodata, ov_SC07_010_jr_801588CC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e1dc, data, tail11]
      - [0x7e274, .rodata, ov_SC07_010_jr_8015A3C8]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e2b0, data, tail12]
      - [0x7e2b4, .rodata, ov_SC07_010_jr_8015B950]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e2d0, data, tail13]
      - [0x7e2d4, .rodata, ov_SC07_010_jr_8015C32C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e2f0, data, tail14]
      - [0x7e328, .rodata, ov_SC07_010_jr_8016AE5C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e348, data, tail15]
      - [0x7e388, .rodata, ov_SC07_010_jr_80171B4C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e3a8, data, tail16]
      - [0x7e54c, .rodata, ov_SC07_010_jr_801789AC]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e564, data, tail17]
      - [0x7e6dc, .rodata, ov_SC07_010_jr_80179B74]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e7f8, data, tail18]
      - [0x7e7fc, .rodata, ov_SC07_010_jr_8017AE2C]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x7e810, data, tail19]
      - [0x813EC, bin, trailing]    # final 3 bytes (EOF not 4-aligned; spimdisasm drops a partial word)
