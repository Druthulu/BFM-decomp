      - [0x1CA44, c, ov_SC06_000_o0b]  # -O0 whale func_80144B9C (0x1CA44..0x1D64C)
      - [0x1d64c, c, ov_SC06_000_after]
      - [0x2c2f4, c, ov_SC06_000_jr_8015444C]
      - [0x2cacc, c, ov_SC06_000_jr_80154C24]
