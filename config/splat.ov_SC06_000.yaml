      - [0x600e4, data, tail]
      - [0x84024, .rodata, ov_SC06_000]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x84100, .rodata, ov_SC06_000_jr_8012ACE0]  # Phase-26 §8 jtbl-rodata carve (jtbl_carve.py)
      - [0x841f4, data, tail2]
